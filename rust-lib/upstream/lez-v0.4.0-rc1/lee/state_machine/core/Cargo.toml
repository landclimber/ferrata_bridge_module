[package]
name = "lee_core"
version = "0.1.0"
edition = "2024"
license = "MIT or Apache-2.0"

[features]
default = []
host = ["ml-kem/getrandom"]
test_utils = ["host"]

[dependencies]
risc0-zkvm = { version = "3.0.5", default-features = false, features = ["std"] }
borsh = { version = "1.5.7", features = ["de_strict_order"] }
serde = { version = "1.0.60", default-features = false, features = ["derive"] }
