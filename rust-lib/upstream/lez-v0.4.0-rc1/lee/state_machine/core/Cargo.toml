thiserror = { version = "2.0" }
base58 = { version = "0.2.0" }
derive_more = { version = "2.1.1", features = ["debug", "display", "as_ref", "from", "into", "deref"] }
ml-kem = { version = "0.3", features = ["hazmat"] }
chacha20 = { version = "0.10" }
